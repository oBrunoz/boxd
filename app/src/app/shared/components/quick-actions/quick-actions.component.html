<div class="flex items-center gap-3">
  <button
    type="button"
    (click)="alternarAssistido()"
    [disabled]="auth.autenticado() && (salvando() || carregando() || semFicha())"
    [attr.aria-pressed]="ficha().assistido"
    [attr.aria-label]="ficha().assistido ? 'Desmarcar como assistido' : 'Marcar como assistido'"
    [title]="ficha().assistido ? 'Assistido' : 'Já assisti'"
    class="w-12 h-12 rounded-full flex items-center justify-center transition duration-300 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed"
    [class]="ficha().assistido ? 'bg-white text-[#111111]' : 'bg-white/10 hover:bg-white/20 text-white'">
    <svg lucideEye [size]="20" strokeWidth="2"></svg>
  </button>

  <button
    type="button"
    (click)="alternarCurtido()"
    [disabled]="auth.autenticado() && (salvando() || carregando() || semFicha())"
    [attr.aria-pressed]="ficha().curtido"
    [attr.aria-label]="ficha().curtido ? 'Descurtir' : 'Curtir'"
    [title]="ficha().curtido ? 'Curtido' : 'Curtir'"
    class="w-12 h-12 rounded-full flex items-center justify-center transition duration-300 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed"
    [class]="ficha().curtido ? 'bg-white text-red-600' : 'bg-white/10 hover:bg-white/20 text-white'">
    <svg lucideHeart [size]="20" strokeWidth="2" [attr.fill]="ficha().curtido ? 'currentColor' : 'none'"></svg>
  </button>

  <button
    type="button"
    (click)="alternarWatchlist()"
    [disabled]="auth.autenticado() && (salvando() || carregando())"
    [attr.aria-pressed]="naWatchlist()"
    [attr.aria-label]="naWatchlist() ? 'Tirar da watchlist' : 'Adicionar à watchlist'"
    [title]="naWatchlist() ? 'Na watchlist' : 'Watchlist'"
    class="w-12 h-12 rounded-full flex items-center justify-center transition duration-300 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed"
    [class]="naWatchlist() ? 'bg-white text-[#111111]' : 'bg-white/10 hover:bg-white/20 text-white'">
    @if (naWatchlist()) {
      <svg lucideCheck [size]="20" strokeWidth="2"></svg>
    } @else {
      <svg lucideBookmark [size]="20" strokeWidth="2"></svg>
    }
  </button>
</div>
