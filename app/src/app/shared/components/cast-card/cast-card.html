<div class="bg-gray-800 rounded-lg overflow-hidden flex flex-col h-full">
  <img
    [src]="actor.profileUrl"
    [alt]="actor.name"
    class="w-full aspect-[2/3] object-cover bg-gray-700"
  />
  <div class="p-4 flex-1 flex flex-col justify-center">
    <h3 class="text-white font-bold text-sm text-center leading-tight mb-1">{{ actor.name }}</h3>
    <p class="text-gray-400 text-xs text-center leading-tight">{{ actor.character }}</p>
  </div>
</div>
