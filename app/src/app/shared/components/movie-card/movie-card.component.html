<a [routerLink]="detailsRoute"
  class="bg-gray-800 rounded-lg overflow-hidden shadow-lg hover:shadow-2xl transform hover:scale-105 transition duration-300 block">
  <div class="aspect-[2/3] relative">
    <img
      [src]="posterUrl"
      [alt]="title"
      class="object-cover w-full h-full"
      loading="lazy"
    />
  </div>
  <div class="p-4">
    <h3 class="text-white font-semibold text-lg truncate">{{ title }}</h3>
    <div class="flex items-center mt-2">
      <span class="text-gray-400 text-sm">{{ year }}</span>
      @if (rating > 0) {
        <span class="ml-auto bg-yellow-500/20 text-yellow-400 px-2 py-1 rounded text-xs font-medium flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" viewBox="0 0 20 20" fill="currentColor">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
          </svg>
          {{ rating.toFixed(1) }}
        </span>
      }
    </div>
  </div>
</a>
