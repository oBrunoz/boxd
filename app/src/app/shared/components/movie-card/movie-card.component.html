<a [routerLink]="detailsRoute"
  class="bg-gray-800 rounded-lg overflow-hidden shadow-lg hover:shadow-2xl transform hover:scale-105 transition duration-300 block">
  <div class="aspect-[2/3] relative">
    <img
      [src]="posterUrl"
      [alt]="title"
      class="object-cover w-full h-full"
      loading="lazy"
    />
  </div>
  <div class="p-4">
    <h3 class="text-white font-semibold text-lg truncate">{{ title }}</h3>
    <div class="flex items-center mt-2">
      <span class="text-gray-400 text-sm">{{ year }}</span>
      @if (rating > 0) {
        <span class="ml-auto bg-yellow-500/20 text-yellow-400 px-2 py-1 rounded text-xs font-medium flex items-center gap-1">
          <lucide-icon [img]="Star" [size]="11" strokeWidth="2" fill="currentColor"></lucide-icon>
          {{ rating.toFixed(1) }}
        </span>
      }
    </div>
  </div>
</a>
