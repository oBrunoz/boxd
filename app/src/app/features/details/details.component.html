<div>
  <app-hero-section
    [label]="contentLabel"
    [title]="title"
    [backgroundUrl]="backgroundUrl()"
    [logoUrl]="logoUrl()"
    [isLoading]="isLoading()"
    [rating]="details()?.vote_average"
    [releaseYear]="releaseYear"
    [runtime]="runtime"
    [tagline]="details()?.tagline ?? ''"
    [genres]="details()?.genres ?? []"
    [overview]="details()?.overview ?? ''"
    [trailerUrl]="trailerUrl()"
    scrollLabel="Detalhes"
    scrollTarget="#more-content">
  </app-hero-section>

  <!-- Additional Content -->
  <section id="more-content" class="py-16 bg-gray-900">
    <div class="container mx-auto px-6">
      @if (contentType() === 'movies' || contentType() === 'series') {
        <!-- Cast placeholder -->
        <h2 class="text-3xl font-bold mb-8 text-white">Elenco</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6 mb-16">
          @for (item of skeletonCast; track $index) {
            <div class="bg-gray-800 rounded-lg p-2 animate-pulse h-64"></div>
          }
        </div>

        <!-- Similar content placeholder -->
        <h2 class="text-3xl font-bold mb-8 text-white">Conteúdo similar</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6">
          @for (item of skeletonSimilar; track $index) {
            <div class="bg-gray-800 rounded-lg p-2 animate-pulse h-64"></div>
          }
        </div>
      } @else if (contentType() === 'people') {
        <h2 class="text-3xl font-bold mb-8 text-white">Conhecido por</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6">
          @for (item of skeletonCast; track $index) {
            <div class="bg-gray-800 rounded-lg p-2 animate-pulse h-64"></div>
          }
        </div>
      }
    </div>
  </section>
</div>
